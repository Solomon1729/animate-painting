<title>アクションメーカー</title>
<script>(function(){try{var o=JSON.parse(localStorage.getItem('am_skin')||'null'),d=document.documentElement;if(o&&typeof o==='object'){['skin','font','round','dens','icon'].forEach(function(k){var v=o[k];if(typeof v==='string'&&/^[a-z]{2,10}$/.test(v)&&v!=='auto')d.setAttribute('data-'+k,v)});
if(d.getAttribute('data-font')==='maru'||(d.getAttribute('data-skin')==='pop'&&!d.getAttribute('data-font'))){var l=document.createElement('link');l.rel='stylesheet';l.id='amfont';l.href='https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;900&display=swap';document.head.appendChild(l)}}}catch(e){}})()</script>
